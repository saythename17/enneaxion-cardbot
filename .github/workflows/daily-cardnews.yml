name: 매일 아침 카드뉴스

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST (GitHub 사정으로 몇~수십 분 늦을 수 있음)
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write          # data/history.json(다룬 주제 기록) 커밋용

concurrency:
  group: daily-cardnews
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 카드뉴스 생성 + 디스코드 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py

      - name: 결과물 보관 (Actions 아티팩트, 30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-${{ github.run_id }}
          path: output/
          retention-days: 30

      - name: 다룬 주제 기록 커밋
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "chore: 오늘 카드뉴스 주제 기록" && git push)

      - name: 실패 알림
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ 오늘 카드뉴스 생성 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
